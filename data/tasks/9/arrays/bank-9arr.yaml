- id: inf-9-arr-022
  class: 9
  topic: Массивы
  subtopic: "Сортировка выбором"
  type: code_run
  difficulty: advanced
  cognitive_level: analyze
  points: 3
  lesson: 9arr-04-sort
  fgos_requirement: 1.3
  fgos_element: 1.6
  fgos: { subject: [inf-9-arr-sort], meta: [plan-actions] }
  prompt: "Отсортируй список [5, 2, 8] по возрастанию сортировкой выбором (два вложенных цикла, без sorted) и выведи результат."
  student_view: {
    language: python,
    template: "a = [5, 2, 8]\nfor i in range(len(a)):\n    imin = i\n    for j in range(i + 1, len(a)):\n        ...\nprint(a)"
  }
  auto_check: { method: code_stdout, timeout_s: 10 }
  teacher_only: 
    solution_code: "a = [5, 2, 8]\nfor i in range(len(a)):\n    imin = i\n    for j in range(i + 1, len(a)):\n        if a[j] < a[imin]:\n            imin = j\n    a[i], a[imin] = a[imin], a[i]\nprint(a)"
    expected_stdout: "[2, 5, 8]"
    explanation: "Внешний цикл выбирает место, внутренний ищет минимум в остатке; обмен — одной строкой через две переменные."

