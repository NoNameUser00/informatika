- id: inf-11-graph-046
  class: 11
  topic: "Выигрышные стратегии"
  subtopic: "Игра на графе кодом"
  type: code_run
  difficulty: advanced
  cognitive_level: analyze
  points: 3
  lesson: 11graph-02-games
  fgos_requirement: 1.4
  fgos_element: 1.5
  fgos: { subject: [inf-11-graph-game-graph], meta: [plan-actions] }
  prompt: "Фишка стоит в вершине ориентированного графа. Игроки ходят по очереди, за ход переводя фишку по ребру вперёд; тот, кому некуда идти, проигрывает. Рёбра: A→B, A→C, B→D, C→D, C→E, D→F, E→F. Разметьте позиции-вершины и выведите сначала число проигрышных вершин, а на новой строке — отметку стартовой вершины A: W, если она выигрышная, и L иначе."
  student_view: { language: python, template: "# Разметьте вершины графа: ход — переход по ребру, нет хода — проигрыш\ngraph = {\n    'A': ['B', 'C'],\n    'B': ['D'],\n    'C': ['D', 'E'],\n    'D': ['F'],\n    'E': ['F'],\n    'F': [],\n}\n# порядок разбора: из каждой вершины рёбра ведут только в уже разобранные\norder = ['F', 'D', 'E', 'B', 'C', 'A']\nwin = {}\nfor v in order:\n    # отметка позиции зависит только от позиций, в которые ведут её ходы\n    ...\nlosing = [v for v in order if not win[v]]\nprint(len(losing))\nprint('W' if win['A'] else 'L')" }
  auto_check: { method: code_stdout, timeout_s: 10 }
  teacher_only: { solution_code: "# вершина -> вершины, в которые можно перейти за один ход\ngraph = {\n    'A': ['B', 'C'],\n    'B': ['D'],\n    'C': ['D', 'E'],\n    'D': ['F'],\n    'E': ['F'],\n    'F': [],\n}\n# вершины идут в топологическом порядке: из каждой рёбра ведут только в разобранные\norder = ['F', 'D', 'E', 'B', 'C', 'A']\nwin = {}\nfor v in order:\n    # выигрышная позиция, если из неё есть ход в проигрышную\n    win[v] = False\n    for u in graph[v]:\n        if not win[u]:\n            win[v] = True\nlosing = [v for v in order if not win[v]]\nprint(len(losing))\nprint('W' if win['A'] else 'L')", expected_stdout: "3\nW", explanation: "Здесь игру решают динамикой по вершинам, а не по числу камней. Вершины разбираются в топологическом порядке F, D, E, B, C, A: из каждой рёбра ведут только в уже разобранные, поэтому нужные отметки уже известны. Из F ходов нет, значит она проигрышная (L); D и E могут перейти в F, поэтому выигрышные; из B и C любой ход ведёт в выигрышную позицию, значит обе проигрышные; из A есть ход в B, поэтому A выигрышная. Проигрышных вершин 3: F, B, C." }

