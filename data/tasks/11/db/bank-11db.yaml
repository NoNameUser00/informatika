  teacher_only: { answer_map: { "Сущность": "объект предметной области, которому соответствует строка таблицы: ученик, класс, блюдо", "Атрибут": "свойство объекта: номер личного дела, фамилия, код класса", "Связь": "отношение между сущностями: ученик состоит в классе", "Первичный ключ": "признак, который однозначно выделяет одну строку среди всех остальных строк таблицы" }, explanation: "Сущность отвечает на вопрос «что описываем» и превращается в таблицу, атрибут — на вопрос «что о нём знаем» и превращается в столбец. Первичный ключ выделяет строку среди остальных: его значения не повторяются и не меняются. Связь показывает, как таблицы зависят друг от друга, и реализуется внешним ключом. Верно: Сущность = объект предметной области, которому соответствует строка таблицы: ученик, класс, блюдо; Атрибут = свойство объекта: номер личного дела, фамилия, код класса; Связь = отношение между сущностями: ученик состоит в классе; Первичный ключ = признак, который однозначно выделяет одну строку среди всех остальных строк таблицы." }

