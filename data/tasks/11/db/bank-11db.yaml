  student_view: { options: [{ id: D, text: "Связи нет: две таблицы просто стоят рядом и никак не зависят друг от друга" }, { id: C, text: "Один к одному: каждому ученику соответствует ровно один класс, и наоборот" }, { id: B, text: "Многие ко многим: ученик может состоять сразу в нескольких классах, а класс — включать много учеников" }, { id: A, text: "Один ко многим: каждому ученику соответствует ровно один класс, а в классе может быть много учеников" }] }
  auto_check: { method: exact_option }
