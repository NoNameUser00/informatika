  student_view: { language: python, template: "# Соберите множество составных ключей\nrows = [\n    (1, 'Математика', '02.09'),\n    (1, 'Математика', '02.09'),\n    (1, 'Физика', '03.09'),\n    (2, 'Математика', '02.09'),\n    (2, 'Физика', '05.09'),\n    (2, 'Физика', '05.09'),\n]\nkeys = []\ndups = 0\nfor row in rows:\n    # полный повтор уже встречался?\n    ...\nprint(len(keys), dups)" }
  auto_check: { method: code_stdout, timeout_s: 10 }
  teacher_only: { solution_code: "rows = [\n    (1, 'Математика', '02.09'),\n    (1, 'Математика', '02.09'),\n    (1, 'Физика', '03.09'),\n    (2, 'Математика', '02.09'),\n    (2, 'Физика', '05.09'),\n    (2, 'Физика', '05.09'),\n]\nkeys = []\ndups = 0\nfor row in rows:\n    if row in keys:\n        dups = dups + 1\n    else:\n        keys.append(row)\nprint(len(keys), dups)", expected_stdout: "4 2", explanation: "По отдельности ни номер ученика, ни предмет, ни дата не дают уникальности: ученик 1 был и на математике, и на физике. Уникальной становится только тройка целиком, поэтому составной ключ даёт 4 различных значений, а 2 полных повтора — это строки, которые база не приняла бы при вставке." }

- id: inf-11-db-018
  class: 11
