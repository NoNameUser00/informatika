  type: single_choice
  difficulty: basic
  cognitive_level: remember
  points: 1
  lesson: 11db-02-queries
  fgos_requirement: 1.1
  fgos_element: 1.1
  fgos: { subject: [inf-11-db-sql], meta: [plan-actions] }
  prompt: "Блюдо «Борщ» заказывали четыре раза, и в результате запроса его название встретилось четыре раза подряд. Какое ключевое слово оставит в результате только одно название?"
  student_view: { options: [{ id: C, text: "GROUP BY: оставляет в результате только различные значения выбранного поля" }, { id: D, text: "COUNT: оставляет в результате только различные значения выбранного поля" }, { id: B, text: "ORDER BY: оставляет в результате только различные значения выбранного поля" }, { id: A, text: "DISTINCT: оставляет в результате только различные значения выбранного поля" }] }
  auto_check: { method: exact_option }
  teacher_only: { answer: "D", explanation: "DISTINCT убирает одинаковые значения выбранного поля: SELECT DISTINCT название FROM Поставки вернёт «Борщ» один раз. ORDER BY только меняет порядок строк, GROUP BY собирает строки в группы для подсчёта, а COUNT считает их количество — ни одно из этих слов повторы в результате не удаляет." }

