  teacher_only: { solution_code: "left = [1, 4, 7, 9]\nright = [2, 3, 8]\nres = []\ni = 0\nj = 0\ncmp = 0\nwhile i < len(left) and j < len(right):\n    cmp = cmp + 1\n    if left[i] <= right[j]:\n        res.append(left[i])\n        i = i + 1\n    else:\n        res.append(right[j])\n        j = j + 1\nwhile i < len(left):\n    res.append(left[i])\n    i = i + 1\nwhile j < len(right):\n    res.append(right[j])\n    j = j + 1\nprint(*res)\nprint(cmp)", expected_stdout: "1 2 3 4 7 8 9\n6", explanation: "Слияние даёт 1, 2, 3, 4, 7, 8, 9 за 6 сравнений. Когда один список кончился, оставшиеся элементы другого просто дописывают — сравнений для них не нужно, поэтому счётчик не растёт. Сортировка слиянием всегда работает примерно за n log n сравнений, но требует дополнительной памяти для промежуточного массива." }

