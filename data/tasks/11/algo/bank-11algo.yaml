  prompt: "Отсортируйте список [5,2,8,1,9] сортировкой вставками: просматривайте элементы слева направо и вставляйте каждый в уже отсортированную часть, сдвигая элементы вправо. Сравнением считайте каждое срабатывание условия «элемент больше вставляемого». Выведите сначала отсортированный список через пробел, затем на новой строке — число сравнений."
  student_view: { language: python, template: "# Сортировка вставками со счётом сравнений\na = [5,2,8,1,9]\nn = len(a)\ncmp = 0\nfor i in range(1, n):\n    key = a[i]\n    j = i - 1\n    while ...:\n        # сдвигаем элемент вправо и считаем сравнение\n        ...\n    a[j + 1] = key\nprint(*a)\nprint(cmp)" }
