  student_view: { language: python, template: "# Измерьте работу вложенного цикла\nfor n in [10, 20, 40]:\n    cnt = 0\n    for i in range(n):\n        for j in range(n):\n            # одно выполнение тела цикла\n            ...\n    print(n, cnt)" }
