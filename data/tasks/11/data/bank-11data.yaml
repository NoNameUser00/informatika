- id: inf-11-data-049
  class: 11
  topic: "Анализ данных"
  subtopic: "Линия тренда и прогноз"
  type: code_run
  difficulty: intermediate
  cognitive_level: apply
  points: 2
  lesson: 11data-04-correlation
  fgos_requirement: 1.1
  fgos_element: 1.1
  fgos: { subject: [inf-11-data-fit], meta: [plan-actions] }
  prompt: "Даны пары значений: x = 2, 4, 6, 8, 10 и y = 3, 7, 8, 12, 14. Постройте линию тренда y = kx + b методом наименьших квадратов и оцените y при x = 12. Выведите два числа в одну строку через пробел: сначала k, затем прогноз, каждое с округлением до сотых."
  student_view: { language: python, template: "# Средние, потом наклон k = Σ(xᵢ − x̄)(yᵢ − ȳ) / Σ(xᵢ − x̄)²\nx = [2, 4, 6, 8, 10]\ny = [3, 7, 8, 12, 14]\nn = len(x)\nmx = ...\nmy = ...\nsxy = 0\nsxx = 0\nfor i in range(n):\n    sxy = sxy + ...\n    sxx = sxx + ...\nk = ...\nb = ...\nprint(round(k, 2), round(k * 12 + b, 2))" }
  auto_check: { method: code_stdout, timeout_s: 10 }
  teacher_only: { solution_code: "x = [2, 4, 6, 8, 10]\ny = [3, 7, 8, 12, 14]\nn = len(x)\nmx = sum(x) / n\nmy = sum(y) / n\nsxy = 0\nsxx = 0\nfor i in range(n):\n    sxy = sxy + (x[i] - mx) * (y[i] - my)\n    sxx = sxx + (x[i] - mx) ** 2\nk = sxy / sxx\nb = my - k * mx\nprint(round(k, 2), round(k * 12 + b, 2))", expected_stdout: "1.35 16.9", explanation: "Средние: x̄ = 6, ȳ = 8,8. Сумма произведений отклонений Sxy = 54, сумма квадратов отклонений X Sxx = 40. Отсюда k = 54 / 40 = 1,35, свободный член b = 8,8 − 1,35 · 6 = 0,7. При x = 12 получаем y = 1,35 · 12 + 0,7 = 16,9. Наклон положительный: с ростом x величина y в среднем растёт на 1,35. В LibreOffice Calc ту же линию даёт функция НАКЛОН." }

