- id: inf-11-data-030
  class: 11
  topic: "Анализ данных"
  subtopic: "Коэффициент корреляции Пирсона"
  type: code_run
  difficulty: advanced
  cognitive_level: analyze
  points: 3
  lesson: 11data-04-correlation
  fgos_requirement: 1.1
  fgos_element: 1.1
  fgos: { subject: [inf-11-data-corr], meta: [plan-actions] }
  prompt: "Даны пары значений: x = 1, 2, 3, 4, 5; y = 3, 5, 4, 6, 7. Вычислите коэффициент корреляции Пирсона по формуле r = Σ(xᵢ − x̄)(yᵢ − ȳ) / √[Σ(xᵢ − x̄)² · Σ(yᵢ − ȳ)²] и выведите результат, округлённый до сотых."
  student_view: { language: python, template: "# Считаем средние, потом числитель и знаменатель\nx = [1, 2, 3, 4, 5]\ny = [3, 5, 4, 6, 7]\nn = len(x)\nmx = ...\nmy = ...\nsxy = 0\nsxx = 0\nsyy = 0\nfor i in range(n):\n    # накапливаем отклонения\n    ...\nr = ...\nprint(round(r, 2))" }
  auto_check: { method: code_stdout, timeout_s: 10 }
  teacher_only: { solution_code: "x = [1, 2, 3, 4, 5]\ny = [3, 5, 4, 6, 7]\nn = len(x)\nmx = sum(x) / n\nmy = sum(y) / n\nsxy = 0\nsxx = 0\nsyy = 0\nfor i in range(n):\n    dx = x[i] - mx\n    dy = y[i] - my\n    sxy = sxy + dx * dy\n    sxx = sxx + dx * dx\n    syy = syy + dy * dy\nr = sxy / (sxx * syy) ** 0.5\nprint(round(r, 2))", expected_stdout: "0.9", explanation: "Средние: x̄ = 3, ȳ = 5. Числитель: (−2)(−2) + (−1)(0) + 0(−1) + 1·1 + 2·2 = 9. Знаменатель: √(10 · 10) = 10. Значит r = 9/10 = 0.9. Положительный знак — прямая связь, модуль близок к 1 — сильная. В LibreOffice Calc то же считает функция КОРРЕЛ." }

