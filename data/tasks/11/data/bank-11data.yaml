- id: inf-11-data-042
  class: 11
  topic: "Анализ данных"
  subtopic: "Дисперсия и стандартное отклонение"
  type: code_run
  difficulty: intermediate
  cognitive_level: apply
  points: 2
  lesson: 11data-02-stats
  fgos_requirement: 1.1
  fgos_element: 1.1
  fgos: { subject: [inf-11-data-stats], meta: [plan-actions] }
  prompt: "Дан набор чисел: 2, 4, 4, 4, 5, 5, 7, 9. Найдите дисперсию D = Σ(xᵢ − x̄)² / n и стандартное отклонение σ = √D. Выведите оба числа в одну строку через пробел, каждое с округлением до сотых."
  student_view: { language: python, template: "# Сначала среднее, потом сумма квадратов отклонений от него\ndata = [2, 4, 4, 4, 5, 5, 7, 9]\nn = len(data)\nmean = ...\nsq = 0\nfor value in data:\n    # прибавляем квадрат отклонения\n    ...\nvariance = ...\nsd = ...\nprint(round(variance, 2), round(sd, 2))" }
  auto_check: { method: code_stdout, timeout_s: 10 }
  teacher_only: { solution_code: "data = [2, 4, 4, 4, 5, 5, 7, 9]\nn = len(data)\nmean = sum(data) / n\nsq = 0\nfor value in data:\n    sq = sq + (value - mean) ** 2\nvariance = sq / n\nsd = variance ** 0.5\nprint(round(variance, 2), round(sd, 2))", expected_stdout: "4.0 2.0", explanation: "Среднее x̄ = 40 / 8 = 5. Отклонения: −3, −1, −1, −1, 0, 0, 2, 4, их квадраты дают 9 + 1 + 1 + 1 + 0 + 0 + 4 + 16 = 32. Дисперсия D = 32 / 8 = 4, стандартное отклонение σ = √4 = 2. В отличие от размаха (9 − 2 = 7) дисперсия учитывает все точки набора, поэтому число устойчивее. В LibreOffice Calc то же дают функции ДИСП и СТАБР." }

