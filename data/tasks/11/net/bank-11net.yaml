  teacher_only: { answer_map: { "Компьютер стал заметно медленнее": "открыть диспетчер задач и посмотреть, какой процесс грузит процессор", "Появился незнакомый сетевой трафик": "сравнить список подключений с программами, которые запущены сейчас", "Файлы пропали, а их имена стали странными": "проверить компьютер антивирусом и не выполнять требования о выкупе", "Браузер открывает не те страницы": "отключить расширения браузера и проверить настройки прокси" }, explanation: "Каждому симптому соответствует своя проверка, и они независимы: антивирус не покажет, какой процесс грузит процессор, а диспетчер задач не увидит подменённые настройки прокси. При вымогательстве главное — не выполнять требование, потому что оплата гарантии не даёт, а уничтожает ключ расшифровки. Верно: Компьютер стал заметно медленнее = открыть диспетчер задач и посмотреть, какой процесс грузит процессор; Появился незнакомый сетевой трафик = сравнить список подключений с программами, которые запущены сейчас; Файлы пропали, а их имена стали странными = проверить компьютер антивирусом и не выполнять требования о выкупе; Браузер открывает не те страницы = отключить расширения браузера и проверить настройки прокси." }

