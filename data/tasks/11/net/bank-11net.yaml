- id: inf-11-net-054
  class: 11
  topic: "Сети"
  subtopic: "Проверка вложенности стеком"
  type: code_run
  difficulty: advanced
  cognitive_level: analyze
  points: 3
  lesson: 11net-02-html
  fgos_requirement: 1.1
  fgos_element: 1.1
  fgos: { subject: [inf-11-net-html], meta: [plan-actions] }
  prompt: "Разметка страницы задана потоком тегов без содержимого: html, head, title, /title, /head, body, ul, li, p, b, /p, /li, /b, /ul, /body, /html. Закрывающий тег должен закрывать последний открытый. Проверьте разметку стеком: закрывающий тег снимает вершину стека, и если имя не совпало — засчитайте одно несовпадение и всё равно снимите вершину. Выведите сначала число несовпадений, затем итоговый размер стека — через пробел."
  student_view: { language: python, template: "# Разбор потока тегов стеком\nstream = ['html', 'head', 'title', '/title', '/head', 'body', 'ul', 'li', 'p', 'b',\n          '/p', '/li', '/b', '/ul', '/body', '/html']\nstack = []\nbad = 0\nfor t in stream:\n    if t.startswith('/'):\n        # снимаем вершину и сверяем имена\n        ...\n    else:\n        stack.append(t)\nprint(bad, len(stack))" }
  auto_check: { method: code_stdout, timeout_s: 10 }
  teacher_only: { solution_code: "stream = ['html', 'head', 'title', '/title', '/head', 'body', 'ul', 'li', 'p', 'b',\n          '/p', '/li', '/b', '/ul', '/body', '/html']\nstack = []\nbad = 0\nfor t in stream:\n    if t.startswith('/'):\n        top = stack.pop()\n        if top != t[1:]:\n            bad = bad + 1\n    else:\n        stack.append(t)\nprint(bad, len(stack))", expected_stdout: "3 0", explanation: "Стек разбирает поток так: /title, /head, /body и /ul закрывают то, что открыли, — несовпадений там нет. Дальше пошло скрещение тегов: /p пытается закрыть b, /li — p, /b — li, поэтому набралось 3 несовпадения, а стек в конце пуст (размер 0): все закрывающие теги на месте, но стоят не в том порядке. Браузер такое исправит молча и покажет не то, что задумано, поэтому проверять разметку стеком стоит до открытия страницы." }

