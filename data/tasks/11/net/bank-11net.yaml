- id: inf-11-net-051
  class: 11
  topic: "Сети"
  subtopic: "Адреса узлов в нескольких подсетях"
  type: code_run
  difficulty: advanced
  cognitive_level: analyze
  points: 3
  lesson: 11net-01-networks
  fgos_requirement: 1.1
  fgos_element: 1.1
  fgos: { subject: [inf-11-net-mask], meta: [plan-actions] }
  prompt: "Локальная сеть разделена на четыре подсети с масками /26, /27, /28, /26. Адрес сети и широковещательный адрес узлам не назначают. Сколько всего адресов узлов во всех четырёх подсетях? Выведите одно число."
  student_view: { language: python, template: "# Для каждой маски посчитайте число адресов узлов\nprefixes = [26, 27, 28, 26]\ntotal = 0\nfor p in prefixes:\n    # 2 ** (32 - p) значений, из них два заняты: сеть и все узлы\n    hosts = ...\n    total = total + hosts\nprint(total)" }
  auto_check: { method: code_stdout, timeout_s: 10 }
  teacher_only: { solution_code: "prefixes = [26, 27, 28, 26]\ntotal = 0\nfor p in prefixes:\n    hosts = 2 ** (32 - p) - 2\n    total = total + hosts\nprint(total)", expected_stdout: "168", explanation: "Подсчёт по маскам: /26 → 2^6 − 2 = 62; /27 → 2^5 − 2 = 30; /28 → 2^4 − 2 = 14; /26 → 2^6 − 2 = 62. Сумма: 62 + 30 + 14 + 62 = 168. Чем короче префикс, тем больше адресов: в /26 их 62, в /27 — уже 30. Забыть про два зарезервированных адреса — самая частая ошибка: без неё получилось бы 176. Такой же расчёт в LibreOffice Calc делается формулой =2^(32−p)−2." }

