- id: inf-11-net-060
  class: 11
  topic: "Сети"
  subtopic: "Отбор адресов по подсетям"
  type: code_run
  difficulty: advanced
  cognitive_level: analyze
  points: 3
  lesson: 11net-04-control
  fgos_requirement: 1.1
  fgos_element: 1.1
  fgos: { subject: [inf-11-net-mask], meta: [plan-actions] }
  prompt: "Список адресов узлов: 192.168.10.1, 192.168.10.65, 192.168.11.5, 192.168.10.200, 10.0.0.1. Определите, сколько из них принадлежат подсети 192.168.10.0/24, а сколько — более узкой подсети 192.168.10.64/26. Переведите каждый адрес в одно число и отсеките хостовую часть маской. Выведите два числа через пробел: сначала для /24, затем для /26."
  student_view: { language: python, template: "# Переведите адрес в число и примените маску побитово\naddrs = ['192.168.10.1', '192.168.10.65', '192.168.11.5', '192.168.10.200', '10.0.0.1']\n\ndef to_num(s):\n    n = 0\n    for part in s.split('.'):\n        n = n * 256 + int(part)\n    return n\n\ndef mask(prefix):\n    return (2 ** 32 - 1) ^ (2 ** (32 - prefix) - 1)\n\nn24 = 0\nn26 = 0\nfor s in addrs:\n    a = to_num(s)\n    # сравниваем с адресом сети после отсечения хостовой части\n    ...\nprint(n24, n26)" }
  auto_check: { method: code_stdout, timeout_s: 10 }
  teacher_only: { solution_code: "addrs = ['192.168.10.1', '192.168.10.65', '192.168.11.5', '192.168.10.200', '10.0.0.1']\n\ndef to_num(s):\n    n = 0\n    for part in s.split('.'):\n        n = n * 256 + int(part)\n    return n\n\ndef mask(prefix):\n    return (2 ** 32 - 1) ^ (2 ** (32 - prefix) - 1)\n\nn24 = 0\nn26 = 0\nfor s in addrs:\n    a = to_num(s)\n    if (a & mask(24)) == to_num('192.168.10.0'):\n        n24 = n24 + 1\n    if (a & mask(26)) == to_num('192.168.10.64'):\n        n26 = n26 + 1\nprint(n24, n26)", expected_stdout: "3 1", explanation: "Переводим адрес в одно число октет за октетом, а маску строим как 2³² − 1 минус единицы в хвостовых битах. Побитовое И отсекает хостовую часть: в подсети 192.168.10.0/24 остались 192.168.10.1, 192.168.10.65, 192.168.10.200 — всего 3, а адрес 192.168.11.5 отпал уже по третьему октету. Подсеть /26 — это 192.168.10.64–192.168.10.127, из неё подходит только 192.168.10.65: у 192.168.10.200 третий байт после маски равен 192, а не 64. Обратите внимание: 192.168.10.200 входит в /24 и не входит в /26 — подсети вложены, и это нормально." }

