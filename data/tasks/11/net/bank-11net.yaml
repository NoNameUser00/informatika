- id: inf-11-net-069
  class: 11
  topic: "Безопасность и ИИ"
  subtopic: "Размер архива по типам файлов"
  type: code_run
  difficulty: intermediate
  cognitive_level: apply
  points: 2
  lesson: 11safe-03-archive
  fgos_requirement: 1.1
  fgos_element: 1.1
  fgos: { subject: [inf-11-safe-archive], meta: [plan-actions] }
  prompt: "В папке лежат три группы файлов: 12 МБ (текстовый документ), 8 МБ (PDF с картинками), 24 МБ (фотографии и видео). В архиве текст сжимается в 5 раз, PDF с картинками — примерно к 90 % от исходного размера, а фотографии и видео не сжимаются вовсе. Сколько мегабайт займёт архив? Выведите целое число (округление до ближайшего целого)."
  student_view: { language: python, template: "# Умножьте размер каждой группы на коэффициент сжатия и сложите\nsizes = [12, 8, 24]\nratios = [0.2, 0.9, 1.0]\ntotal = 0.0\nfor i in range(len(sizes)):\n    # доля файла после сжатия\n    part = ...\n    total = total + part\nprint(round(total))" }
  auto_check: { method: code_stdout, timeout_s: 10 }
  teacher_only: { solution_code: "sizes = [12, 8, 24]\nratios = [0.2, 0.9, 1.0]\ntotal = 0.0\nfor i in range(len(sizes)):\n    # доля файла после сжатия\n    part = sizes[i] * ratios[i]\n    total = total + part\nprint(round(total))", expected_stdout: "34", explanation: "Считаем по частям: 12 · 0.2 = 2.4, 8 · 0.9 = 7.2, 24 · 1 = 24. Сумма 2.4 + 7.2 + 24 = 33.6 МБ, округляем до 34. Вывод здесь важнее арифметики: из 44 МБ исходных данных почти не сжались 24 МБ фотографий и видео — они уже в сжатом виде, и повторное сжатие лишь добавляет проценты. Ради одних фотографий архив и не делают." }

