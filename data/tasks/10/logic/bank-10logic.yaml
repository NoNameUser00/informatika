  student_view: { options: [{ id: B, text: "0" }, { id: C, text: "Вычислить нельзя: выражение записано не в базисе И, ИЛИ и НЕ" }, { id: A, text: "1" }, { id: D, text: "Значение зависит от того, в каком порядке выполнить операции" }] }
