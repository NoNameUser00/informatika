- id: inf-10-ss-045
  class: 10
  topic: "Системы счисления углублённо"
  subtopic: "Сложение двоичных чисел в столбик"
  type: code_run
  difficulty: basic
  cognitive_level: remember
  points: 1
  lesson: 10ss-03-arith
  fgos_requirement: 1.2
  fgos_element: 1.3
  fgos: { subject: [inf-10-ss-arith], meta: [plan-actions] }
  prompt: "Сложите двоичные числа 10110 и 1101 столбиком, не переводя их в десятичную систему: складывайте поразрядно с переносом. Выведите результат в двоичной системе счисления, а на следующей строке — его десятичное значение."
  student_view: { language: python, template: "# Сложение двоичных чисел поразрядно с переносом\na = list('10110')\nb = list('1101')\ni = len(a) - 1\nj = len(b) - 1\ncarry = 0\nres = []\nwhile i >= 0 or j >= 0 or carry > 0:\n    x = 0\n    y = 0\n    # берём текущие разряды, если они ещё не закончились\n    ...\n    # суммируем с переносом, в разряд идёт остаток, перенос уходит дальше\n    ...\nanswer = ''\nprint(answer)\nprint(int(answer, 2))" }
  auto_check: { method: code_stdout, timeout_s: 10 }
  teacher_only: { solution_code: "a = list('10110')\nb = list('1101')\ni = len(a) - 1\nj = len(b) - 1\ncarry = 0\nres = []\nwhile i >= 0 or j >= 0 or carry > 0:\n    x = 0\n    y = 0\n    if i >= 0:\n        x = int(a[i])\n        i = i - 1\n    if j >= 0:\n        y = int(b[j])\n        j = j - 1\n    # складываем текущие разряды вместе с переносом\n    s = x + y + carry\n    # в разряд пишем остаток от деления на 2, перенос уходит в старший разряд\n    res.append(str(s % 2))\n    carry = s // 2\nanswer = ''.join(reversed(res))\nprint(answer)\nprint(int(answer, 2))", expected_stdout: "100011\n35", explanation: "Складываем справа налево: 0 + 1 = 1, 1 + 0 = 1, затем 1 + 1 = 10 — в разряд пишем 0, а перенос 1 отдаём в следующий разряд; дальше снова 1 + 1 + 1 = 11, в разряд идёт 1 и перенос 1. В сумме получается 100011₂. Проверка в десятичной системе: 22 + 13 = 35. Переносом может быть только 0 или 1, потому что два двоичных разряда вместе с переносом дают не больше 3." }

