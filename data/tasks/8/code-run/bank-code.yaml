- id: inf-8-code-004
  class: 8
  topic: Код в тренажёре
  subtopic: Цикл и bin()
  type: code_run
  difficulty: intermediate
  cognitive_level: apply
  points: 3
  lesson: numsys-02-binary
  fgos_requirement: 1.2
  fgos_element: 1.3
  fgos: { subject: [inf-8-code-loop], meta: [plan-actions] }
  prompt: "Циклом выведи числа 1, 2, 3 и их двоичные записи (каждое с новой строки: число, пробел, bin)."
  student_view:
    language: python
    template: "# Допиши цикл\nfor i in range(1, 4):\n    ..."
  auto_check: { method: code_stdout, timeout_s: 10 }
  teacher_only:
    solution_code: "for i in range(1, 4):\n    print(i, bin(i))"
    expected_stdout: "1 0b1\n2 0b10\n3 0b11"
    explanation: "Три строки: десятичное и bin через пробел"

- id: inf-8-code-005
  class: 8
  topic: Код в тренажёре
  subtopic: Алгоритм Евклида
  type: code_run
  difficulty: advanced
  cognitive_level: analyze
  points: 3
  lesson: alg-04-loops
  fgos_requirement: 1.4
  fgos_element: 1.5
  fgos: { subject: [inf-8-code-euclid], meta: [plan-actions] }
  prompt: "Найди НОД чисел 48 и 18 циклом while (алгоритм Евклида) и выведи его."
  student_view:
    language: python
    template: "# Допиши алгоритм Евклида\na, b = 48, 18\n..."
  auto_check: { method: code_stdout, timeout_s: 10 }
  teacher_only:
    solution_code: "a, b = 48, 18\nwhile b:\n    a, b = b, a % b\nprint(a)"
    expected_stdout: "6"
    explanation: "НОД(48, 18) = 6"

