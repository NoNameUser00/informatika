  topic: "Элементы математической логики"
  subtopic: "Приоритет операций в записи"
  type: numeric_base
  difficulty: basic
  cognitive_level: remember
  points: 1
  lesson: logic-05-expression
  fgos_requirement: 1.4
  fgos_element: 1.5
  fgos: { subject: [inf-8-logic-ops], meta: [plan-actions] }
  prompt: "Вычислите значение выражения A ∨ B ∧ C при A = 1, B = 1, C = 0. Запишите только число."
  student_view: { base: 10, placeholder: "только число" }
  auto_check: { method: numeric_base, base: 10, strip_affixes: true }
  teacher_only: { accepted_values_decimal: [1], answer_text: "1", explanation: "Сначала выполняется И — оно старше ИЛИ по приоритету: B ∧ C = 1 ∧ 0 = 0. Затем A ∨ 0 = 1 ∨ 0 = 1. Если же прочитать запись как (A ∨ B) ∧ C, получится 1 ∧ 0 = 0 — другой ответ, поэтому в записи важны скобки." }

- id: inf-8-logic-068
  class: 8
  topic: "Элементы математической логики"
  subtopic: "Ровно одно из двух"
  type: single_choice
  difficulty: basic
  cognitive_level: remember
  points: 1
  lesson: logic-05-expression
  fgos_requirement: 1.4
  fgos_element: 1.5
  fgos: { subject: [inf-8-logic-ops], meta: [plan-actions] }
  prompt: "Запишите логическое выражение из двух высказываний A и B, которое истинно тогда и только тогда, когда ровно одно из них истинно."
  student_view: { options: [{ id: C, text: "A ∨ B" }, { id: D, text: "(A ∧ ¬B) ∧ (¬A ∧ B)" }, { id: A, text: "(A ∧ ¬B) ∨ (¬A ∧ B)" }, { id: B, text: "A ∧ B" }] }
  auto_check: { method: exact_option }
  teacher_only: { answer: C, explanation: "Формула «ровно одно» разбирается на два случая: A истинно, B ложно — или наоборот. Это две конъюнкции (A ∧ ¬B) и (¬A ∧ B), соединённые ИЛИ, то есть (A ∧ ¬B) ∨ (¬A ∧ B). Проверка перебором всех четырёх наборов: эта запись истинна в строках 01 и 10. Вариант A ∧ B истинна только при обоих единицах, вариант A ∨ B — ещё и при 11, а двойное И вообще всегда ложно." }

- id: inf-8-logic-069
  class: 8
  topic: "Элементы математической логики"
  subtopic: "Закон ассоциативности"
  type: numeric_base
  difficulty: basic
  cognitive_level: remember
  points: 1
  lesson: logic-06-laws
  fgos_requirement: 1.4
  fgos_element: 1.5
  fgos: { subject: [inf-8-logic-laws], meta: [plan-actions] }
  prompt: "Скобки в конъюнкции из четырёх высказываний A, B, C и D расставляют разными способами. Сколько существует таких расстановок, при которых значение выражения одинаково при любых значениях A, B, C и D? Запишите только число."
  student_view: { base: 10, placeholder: "только число" }
  auto_check: { method: numeric_base, base: 10, strip_affixes: true }
  teacher_only: { accepted_values_decimal: [5], answer_text: "5", explanation: "Расстановок скобок в цепочке из четырёх высказываний пять: (A ∧ (B ∧ (C ∧ D))); (A ∧ ((B ∧ C) ∧ D)); ((A ∧ B) ∧ (C ∧ D)); ((A ∧ (B ∧ C)) ∧ D); (((A ∧ B) ∧ C) ∧ D). Закон ассоциативности (A ∧ B) ∧ C = A ∧ (B ∧ C) говорит, что переносить скобки можно свободно, поэтому совпадают значения всех пяти записей — это проверяется перебором всех 16 наборов значений. Для дизъюнкции дело обстоит так же, а вот для смеси ∧ и ∨ закон не действует: там скобки обязательны." }

- id: inf-8-logic-070
  class: 8
  topic: "Элементы математической логики"
  subtopic: "Название закона по записи"
  type: single_choice
  difficulty: basic
  cognitive_level: remember
  points: 1
  lesson: logic-06-laws
  fgos_requirement: 1.4
  fgos_element: 1.5
  fgos: { subject: [inf-8-logic-laws], meta: [plan-actions] }
  prompt: "Какой закон алгебры логики записывается равенством A ∨ B = B ∨ A?"
  student_view: { options: [{ id: A, text: "закон коммутативности" }, { id: D, text: "закон де Моргана" }, { id: B, text: "закон ассоциативности" }, { id: C, text: "закон дистрибутивности" }] }
  auto_check: { method: exact_option }
  teacher_only: { answer: A, explanation: "Коммутативность — переставимость операндов: от перестановки A и B ∨ значение не меняется, поэтому в записи оба слагаемых меняются местами. Ассоциативность переставляет не операнды, а скобки: (A ∨ B) ∨ C = A ∨ (B ∨ C). Дистрибутивность разносит множитель в скобки: A ∧ (B ∨ C) = (A ∧ B) ∨ (A ∧ C). Закон де Моргана отрицание переносит внутрь: ¬(A ∨ B) = ¬A ∧ ¬B." }
