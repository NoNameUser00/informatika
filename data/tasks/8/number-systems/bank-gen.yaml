  student_view: { language: python, template: "# Складываем двоичные числа поразрядно: единицы в сумме 2 и больше дают 0 в этом разряде и единицу в следующий\ndef add_bin(a, b):\n    # строки равной длины, разряды считаем справа налево\n    res = ''\n    carry = 0\n    for i in range(len(a) - 1, -1, -1):\n        # TODO: сложить цифры разрядов вместе с переносом\n        ...\n    return res\n\n\nprint(add_bin('1011', '1101'))" }
  auto_check: { method: code_stdout, timeout_s: 10 }
  teacher_only: { solution_code: "def add_bin(a, b):\n    res = ''\n    carry = 0\n    for i in range(len(a) - 1, -1, -1):\n        t = int(a[i]) + int(b[i]) + carry\n        res = str(t % 2) + res\n        carry = t // 2\n    if carry:\n        res = str(carry) + res\n    return res\n\n\nprint(add_bin('1011', '1101'))", expected_stdout: "11000", explanation: "Разряды складываются справа налево вместе с переносом: 1 + 1 = 2 → в разряд пишем 0, единицу переносим в следующий. Дальше 1 + 0 + 1 = 2 → снова 0 и перенос, затем 0 + 1 + 1 = 2 → 0 и перенос, и наконец 1 + 1 + 1 = 3 → в разряд 1, перенос 1 в новый старший разряд. Получается 11000₂. Функция bin() дала бы тот же результат, но к строке добавился бы префикс 0b, а здесь вывести надо чистую запись." }

