- id: inf-8-numsys-005
  class: 8
  topic: Системы счисления
  subtopic: Количество единиц
  type: single_choice
  difficulty: basic
  cognitive_level: analyze
  points: 1
  lesson: numsys-02-binary
  fgos_requirement: 1.2
  fgos_element: 1.3
  fgos: { subject: [inf-8-numsys-represent], meta: [self-control] }
  prompt: Сколько единиц в двоичной записи числа 15₁₀?
  student_view:
    options:
      - { id: A, text: "2" }
      - { id: B, text: "3" }
      - { id: C, text: "4" }
      - { id: D, text: "1" }
  auto_check:
    method: exact_option
  teacher_only:
    answer: C
    explanation: "15 = 1111_2, четыре единицы"
    common_errors: ["Путают с числом нулей", "Считают 15_10 как 111_2"]

