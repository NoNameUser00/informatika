- id: inf-8-numsys-012
  class: 8
  topic: Системы счисления
  subtopic: Позиционная vs непозиционная
  type: single_choice
  difficulty: basic
  cognitive_level: remember
  points: 1
  lesson: numsys-01-intro
  fgos_requirement: 1.1
  fgos_element: 1.1
  fgos: { subject: [inf-8-numsys-represent], meta: [plan-actions] }
  prompt: Какая система счисления является непозиционной?
  student_view:
    options:
      - { id: A, text: "Двоичная" }
      - { id: B, text: "Римская" }
      - { id: C, text: "Восьмеричная" }
      - { id: D, text: "Шестнадцатеричная" }
  auto_check:
    method: exact_option
  teacher_only:
    answer: B
    explanation: "В римской значение знака не зависит от позиции (I, V, X...), в остальных — зависит от разряда"
    common_errors: ["Путают основание с позиционностью"]

