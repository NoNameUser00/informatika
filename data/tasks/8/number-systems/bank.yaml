# Банк пилота: 8 класс, Системы счисления. Учебный срез (тренажер).
# ВНИМАНИЕ: для боевой контрольной teacher_only уходит в БД/Edge Function, в GitHub Pages не попадает.
# Теги: fgos_requirement 1.1/1.2, fgos_element 1.1-1.4 (ФРП база 7-9, 8 класс), lesson numsys-01..06.
# Формат промптов — как в Яндекс.Форме учителя: основание подстрочным (₂ ₈ ₁₀ ₁₆),
# «Запишите только число», арифметика — ответ в десятичной.

- id: inf-8-numsys-001
  class: 8
  topic: Системы счисления
  subtopic: Перевод 10->2
  type: numeric_base
  difficulty: basic
  cognitive_level: apply
  points: 1
  lesson: numsys-02-binary
  fgos_requirement: 1.2
  fgos_element: 1.3
  fgos: { subject: [inf-8-numsys-convert], meta: [plan-actions] }
  prompt: Переведите число 13₁₀ в двоичную систему. Запишите только число.
  student_view:
    base: 2
    placeholder: "только число"
  auto_check:
    method: numeric_base
    base: 2
    strip_affixes: true
  teacher_only:
    accepted_values_decimal: [13]
    answer_text: "1101"
    explanation: "13 = 8+4+1 = 1101_2"

